<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Hearing" />
    <!-- 노치·상태바 색. 앱 배경(--color-neutral-950)과 동일하게 유지한다. -->
    <meta name="theme-color" content="#11120f" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hearing</title>
    <meta name="description" content="청각장애인을 위한 AI 웨어러블 보조 서비스" />

    <!-- 링크 공유 미리보기(카카오톡·슬랙·디스코드 등). og:image는 절대 URL이어야 하며
         1200x630(1.91:1)이 큰 미리보기로 표시되는 표준 크기다. 원본은 public/og-image.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hearing" />
    <meta property="og:title" content="Hearing" />
    <meta property="og:description" content="청각장애인을 위한 AI 웨어러블 보조 서비스" />
    <meta property="og:url" content="https://hearinghub.vercel.app/" />
    <meta property="og:image" content="https://hearinghub.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hearing 앱 화면 - 소리 필터링과 실시간 소리 감지" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hearing" />
    <meta name="twitter:description" content="청각장애인을 위한 AI 웨어러블 보조 서비스" />
    <meta name="twitter:image" content="https://hearinghub.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
